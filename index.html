<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Status & Updates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
        </span>
        <h1 class="text-xl font-bold text-slate-900">System Status & Updates</h1>
      </div>
      <a href="#admin" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg">Admin Panel</a>
    </div>
  </header>

  <!-- Main Feed Area -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full space-y-6">

    <!-- Search & Filter Controls -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
      <div class="relative w-full sm:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="Search updates history..." class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      <div class="flex flex-wrap gap-1.5 w-full sm:w-auto" id="filter-buttons">
        <button onclick="filterCategory('All')" class="category-btn active text-xs font-semibold px-3 py-2 rounded-lg bg-sky-600 text-white">All</button>
        <button onclick="filterCategory('Maintenance')" class="category-btn text-xs font-semibold px-3 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Maintenance</button>
        <button onclick="filterCategory('Features')" class="category-btn text-xs font-semibold px-3 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Features</button>
        <button onclick="filterCategory('Bug Fixes')" class="category-btn text-xs font-semibold px-3 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Bug Fixes</button>
        <button onclick="filterCategory('Security')" class="category-btn text-xs font-semibold px-3 py-2 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200">Security</button>
      </div>
    </div>

    <!-- Timeline Updates Container -->
    <div id="updates-timeline" class="space-y-4">
      <!-- Updates load dynamically here -->
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="max-w-5xl mx-auto px-4 text-center text-xs text-slate-400">
      &copy; 2026 System Updates Portal. All rights reserved.
    </div>
  </footer>

</body>
</html>
