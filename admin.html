<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAccount | System Updates</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <div class="min-h-full flex flex-col">

        <!-- Header -->
        <header class="sticky top-0 z-40 w-full border-b border-slate-200 dark:border-slate-800 glass-panel">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="canon-logo.png" alt="Canon Logo" class="h-8 w-auto object-contain">
                    <div>
                        <h1 class="font-bold text-lg leading-tight tracking-tight">MyAccount Payment Portal</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Official System Updates</p>
                    </div>
                </div>

                <!-- Dark Mode Toggle -->
                <button id="themeToggleBtn" onclick="toggleDarkMode()" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <section class="space-y-4">

                <!-- Search and Filters -->
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="filterUpdates()" placeholder="Search updates history..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
                    </div>

                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0" id="categoryFilterContainer">
                        <button onclick="setFilter('All')" class="filter-btn active text-xs font-medium px-3.5 py-2 rounded-lg bg-brand-600 text-white transition-all whitespace-nowrap" data-category="All">All</button>
                        <button onclick="setFilter('Maintenance')" class="filter-btn text-xs font-medium px-3.5 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap" data-category="Maintenance">Maintenance</button>
                        <button onclick="setFilter('Feature')" class="filter-btn text-xs font-medium px-3.5 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap" data-category="Feature">Features</button>
                    </div>
                </div>

                <!-- Timeline Feed -->
                <div id="updatesTimeline" class="space-y-4"></div>

                <!-- Empty State -->
                <div id="emptyState" class="hidden text-center py-16 px-4 border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl">
                    <i class="fa-solid fa-inbox text-4xl text-slate-400 mb-3"></i>
                    <h3 class="font-semibold text-lg">No updates found</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400">Try adjusting your search terms or filter selection.</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 bg-white dark:bg-slate-900">
            <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-3">
                <p>&copy; <span id="yearSpan"></span> System Status & Changelog Network.</p>
            </div>
        </footer>
    </div>

    <script>
        const defaultUpdates = [
            { id: "1", title: "Scheduled Maintenance: Core Database Upgrade", category: "Maintenance", date: "2026-10-20", content: "We will be performing a routine database software upgrade on October 20th starting at 02:00 UTC." },
            { id: "2", title: "Feature Release: Enhanced API Key Management & Webhooks", category: "Feature", date: "2026-10-14", content: "You can now generate granular API scopes directly inside your developer dashboard!" }
        ];

        let updates = [];
        let activeFilter = "All";

        window.onload = function() {
            document.getElementById('yearSpan').textContent = new Date().getFullYear();
            loadUpdates();
            renderPublicUpdates();
        };

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function loadUpdates() {
            const saved = localStorage.getItem('system_updates_data');
            if (saved) {
                try {
                    updates = JSON.parse(saved).filter(u => u.category === 'Maintenance' || u.category === 'Feature');
                } catch (e) {
                    updates = defaultUpdates;
                }
            } else {
                updates = defaultUpdates;
            }
        }

        function getCategoryBadge(category) {
            return category === 'Maintenance' 
                ? '<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20"><i class="fa-solid fa-wrench mr-1"></i> Maintenance</span>'
                : '<span class="px-2.5 py-1 rounded-md text-xs font-semibold bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20"><i class="fa-solid fa-rocket mr-1"></i> Feature</span>';
        }

        function renderPublicUpdates() {
            const container = document.getElementById('updatesTimeline');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = updates.filter(item => {
                const matchesFilter = (activeFilter === "All" || item.category === activeFilter);
                const matchesSearch = item.title.toLowerCase().includes(searchVal) || item.content.toLowerCase().includes(searchVal);
                return matchesFilter && matchesSearch;
            }).sort((a, b) => new Date(b.date) - new Date(a.date));

            container.innerHTML = '';
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            filtered.forEach(item => {
                const card = document.createElement('article');
                card.className = "p-6 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm space-y-4";
                const formattedDate = new Date(item.date).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });

                card.innerHTML = `
                    <div class="flex items-center gap-2">
                        ${getCategoryBadge(item.category)}
                        <span class="text-xs text-slate-400 font-medium"><i class="fa-regular fa-calendar mr-1"></i>${formattedDate}</span>
                    </div>
                    <h3 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">${escapeHtml(item.title)}</h3>
                    <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed whitespace-pre-line">${escapeHtml(item.content)}</p>
                `;
                container.appendChild(card);
            });
        }

        function setFilter(category) {
            activeFilter = category;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = (btn.getAttribute('data-category') === category)
                    ? "filter-btn active text-xs font-medium px-3.5 py-2 rounded-lg bg-brand-600 text-white transition-all whitespace-nowrap"
                    : "filter-btn text-xs font-medium px-3.5 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all whitespace-nowrap";
            });
            renderPublicUpdates();
        }

        function filterUpdates() { renderPublicUpdates(); }
        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
</html>
