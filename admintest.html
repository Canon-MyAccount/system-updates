<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Portal | Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 900: '#0c4a6e' } } } }
        }
    </script>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;700&family=Mirza&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Quill.js Rich Text Editor CSS -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; } 
        .ql-editor { min-height: 220px; font-size: 15px; }
        
        /* Neatly organized toolbar styling */
        .ql-toolbar.ql-snow { 
            border-top-left-radius: 0.75rem; 
            border-top-right-radius: 0.75rem; 
            border-color: #cbd5e1; 
            background-color: #f8fafc; 
            padding: 10px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        .ql-container.ql-snow { 
            border-bottom-left-radius: 0.75rem; 
            border-bottom-right-radius: 0.75rem; 
            border-color: #cbd5e1; 
        }

        /* Register custom Google Fonts inside Quill */
        .ql-font-roboto { font-family: 'Roboto', sans-serif; }
        .ql-font-mirza { font-family: 'Mirza', cursive; }
        .ql-font-comic { font-family: 'Comic Neue', cursive; }
        .ql-font-serif { font-family: Georgia, serif; }
        .ql-font-monospace { font-family: Monaco, monospace; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200">

    <div class="min-h-full flex flex-col">
        <!-- Top Navigation Bar -->
        <header class="sticky top-0 z-40 w-full border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="canon-logo.png" alt="Canon Logo" class="h-8 w-auto object-contain">
                    <h1 class="font-bold text-lg">Internal Admin Portal</h1>
                </div>
                <a href="index.html" target="_blank" class="text-xs font-semibold px-4 py-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">View Live Customer Site &rarr;</a>
            </div>
        </header>

        <!-- Main Body Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            <div class="border-b border-slate-200 dark:border-slate-800 pb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <span class="text-xs font-bold text-brand-600 dark:text-brand-400 uppercase tracking-wider"><i class="fa-solid fa-shield-halved"></i> Private Office Management</span>
                    <h2 class="text-2xl sm:text-3xl font-bold tracking-tight mt-1">Manage & Broadcast System Updates</h2>
                </div>
                <button onclick="openEmailModal()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm flex items-center gap-2 shadow-md transition-all">
                    <i class="fa-solid fa-paper-plane"></i> Email Announcement Builder
                </button>
            </div>

            <!-- TOP SECTION: Post / Edit Form -->
            <section class="p-6 sm:p-8 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-sm space-y-6">
                <h3 class="font-bold text-xl flex justify-between items-center" id="formTitle">
                    <span><i class="fa-solid fa-pen-to-square text-brand-500 mr-2"></i>Post New Update</span>
                    <button id="cancelEditBtn" onclick="resetForm()" class="hidden text-xs font-semibold text-rose-500 hover:underline">Cancel Edit</button>
                </h3>
                
                <form id="updateForm" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    <input type="hidden" id="updateId">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-1">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Update Title</label>
                            <input type="text" id="postTitle" required placeholder="e.g. Scheduled System Maintenance" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                        </div>

                        <div class="md:col-span-1">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Category</label>
                            <select id="postCategory" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                                <option value="Maintenance">Maintenance</option>
                                <option value="Feature">Feature Release</option>
                            </select>
                        </div>

                        <div class="md:col-span-1">
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Date</label>
                            <input type="date" id="postDate" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition">
                        </div>
                    </div>

                    <!-- Rich Text Editor Container -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Update Details & Description (Expanded Toolbar)</label>
                        <div id="editorContainer" class="bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100"></div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm shadow-md transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus"></i> Publish Update
                    </button>
                </form>
            </section>

            <!-- BOTTOM SECTION: Published History Feed -->
            <section class="space-y-4 pt-2">
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                    <h3 class="font-bold text-xl">Published History (<span id="adminCount">0</span>)</h3>
                    <span class="text-xs text-slate-400 font-medium">All published records sorted by date</span>
                </div>

                <div id="adminUpdatesList" class="space-y-3"></div>
            </section>
        </main>
    </div>

    <!-- EMAIL BUILDER MODAL -->
    <div id="emailModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <h3 class="font-bold text-base">Generate Email Announcement</h3>
                <button onclick="closeEmailModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                <select id="emailSelectPost" onchange="generateEmailPreview()" class="w-full px-4 py-2.5 border rounded-xl text-sm bg-slate-50 dark:bg-slate-800 dark:border-slate-700"></select>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <iframe id="emailPreviewIframe" class="w-full h-80 bg-white border border-slate-200 rounded-xl"></iframe>
                    <textarea id="emailHtmlOutput" readonly class="w-full h-80 p-3 font-mono text-xs rounded-xl bg-slate-900 text-slate-200 resize-none focus:outline-none"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                <button onclick="copyEmailHTML()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold transition">Copy HTML Code</button>
                <button onclick="closeEmailModal()" class="px-5 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 rounded-xl text-xs font-bold transition">Done</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-xl bg-slate-900 text-white shadow-2xl border border-slate-700">
        <i class="fa-solid fa-circle-check text-emerald-400" id="toastIcon"></i>
        <span id="toastMsg" class="text-sm font-medium">Notification</span>
    </div>

    <!-- Quill JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <script>
        let updates = [];
        let quill;

        // Register custom fonts into Quill's Font Attributor
        const Font = Quill.import('formats/font');
        Font.whitelist = ['sans-serif', 'serif', 'monospace', 'roboto', 'mirza', 'comic'];
        Quill.register(Font, true);

        window.onload = function() { 
            quill = new Quill('#editorContainer', {
                theme: 'snow',
                placeholder: 'Provide detailed notice with custom fonts, colors, bullet points, numbers, and styles...',
                modules: {
                    toolbar: [
                        // Group 1: Fonts & Sizes
                        [{ 'font': ['sans-serif', 'serif', 'monospace', 'roboto', 'mirza', 'comic'] }, { 'size': ['small', false, 'large', 'huge'] }],
                        
                        // Group 2: Text Styles
                        ['bold', 'italic', 'underline', 'strike'],
                        
                        // Group 3: Color Palette & Highlights
                        [{ 'color': [] }, { 'background': [] }],
                        
                        // Group 4: Subscript / Superscript
                        [{ 'script': 'sub'}, { 'script': 'super' }],
                        
                        // Group 5: Lists & Indentation
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'indent': '-1'}, { 'indent': '+1' }],
                        
                        // Group 6: Text Alignment
                        [{ 'align': [] }],
                        
                        // Group 7: Clear Formatting
                        ['clean']
                    ]
                }
            });

            loadUpdates(); 
            setDefaultDate(); 
            renderAdminUpdates(); 
        };

        function loadUpdates() {
            const saved = localStorage.getItem('system_updates_data');
            updates = saved ? JSON.parse(saved) : [];
        }
        function saveUpdates() { localStorage.setItem('system_updates_data', JSON.stringify(updates)); }
        function setDefaultDate() { document.getElementById('postDate').value = new Date().toISOString().split('T')[0]; }

        function renderAdminUpdates() {
            const container = document.getElementById('adminUpdatesList');
            document.getElementById('adminCount').textContent = updates.length;
            container.innerHTML = '';

            if (updates.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-sm text-slate-400 border border-dashed rounded-2xl bg-white dark:bg-slate-900">No updates published yet.</div>`;
                return;
            }

            const sorted = [...updates].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-5 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-sm hover:shadow-md transition-all";
                div.innerHTML = `
                    <div class="space-y-1.5 flex-1">
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-bold px-2.5 py-1 rounded-md ${item.category === 'Maintenance' ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20' : 'bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20'}">[${item.category}]</span>
                            <span class="text-xs text-slate-400 font-medium"><i class="fa-regular fa-calendar mr-1"></i>${item.date}</span>
                        </div>
                        <h4 class="font-bold text-base text-slate-900 dark:text-white">${escapeHtml(item.title)}</h4>
                    </div>
                    <div class="flex items-center gap-3 self-end sm:self-center shrink-0">
                        <button onclick="editUpdate('${item.id}')" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 text-xs font-semibold text-brand-600 dark:text-brand-400 flex items-center gap-1.5 transition"><i class="fa-solid fa-pen"></i> Edit</button>
                        <button onclick="deleteUpdate('${item.id}')" class="px-3 py-1.5 rounded-lg border border-rose-200 dark:border-rose-900/50 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-xs font-semibold text-rose-500 flex items-center gap-1.5 transition"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('updateId').value;
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const date = document.getElementById('postDate').value;
            const content = quill.root.innerHTML;

            if (quill.getText().trim().length === 0) {
                showToast("Please provide details for the update.", true);
                return;
            }

            if (id) {
                const idx = updates.findIndex(u => u.id === id);
                if (idx !== -1) updates[idx] = { id, title, category, date, content };
                showToast("Update modified successfully!");
            } else {
                updates.unshift({ id: Date.now().toString(), title, category, date, content });
                showToast("New system update published!");
            }
            saveUpdates(); resetForm(); renderAdminUpdates();
        }

        function editUpdate(id) {
            const item = updates.find(u => u.id === id);
            if (!item) return;
            document.getElementById('updateId').value = item.id;
            document.getElementById('postTitle').value = item.title;
            document.getElementById('postCategory').value = item.category;
            document.getElementById('postDate').value = item.date;
            quill.root.innerHTML = item.content;

            document.getElementById('formTitle').querySelector('span').innerHTML = '<i class="fa-solid fa-pen text-brand-500 mr-2"></i>Edit Update';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteUpdate(id) {
            updates = updates.filter(u => u.id !== id);
            saveUpdates(); renderAdminUpdates(); showToast("Update deleted.", true);
        }

        function resetForm() {
            document.getElementById('updateForm').reset();
            document.getElementById('updateId').value = '';
            quill.setContents([]);
            setDefaultDate();
            document.getElementById('formTitle').querySelector('span').innerHTML = '<i class="fa-solid fa-pen-to-square text-brand-500 mr-2"></i>Post New Update';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function openEmailModal() {
            const select = document.getElementById('emailSelectPost');
            select.innerHTML = '';
            if (updates.length === 0) { showToast("Please publish an update first.", true); return; }
            updates.forEach(u => {
                const opt = document.createElement('option'); opt.value = u.id; opt.textContent = `[${u.category}] ${u.title}`;
                select.appendChild(opt);
            });
            document.getElementById('emailModal').classList.remove('hidden');
            generateEmailPreview();
        }

        function closeEmailModal() { document.getElementById('emailModal').classList.add('hidden'); }

        function generateEmailPreview() {
            const id = document.getElementById('emailSelectPost').value;
            const item = updates.find(u => u.id === id) || updates[0];
            if (!item) return;

            const htmlTemplate = `<!DOCTYPE html><html><head><link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Roboto&family=Mirza&family=Comic+Neue&display=swap" rel="stylesheet"><style>.ql-font-roboto{font-family:'Roboto',sans-serif;}.ql-font-mirza{font-family:'Mirza',cursive;}.ql-font-comic{font-family:'Comic Neue',cursive;}.ql-font-serif{font-family:Georgia,serif;}.ql-font-monospace{font-family:Monaco,monospace;}</style></head><body style="font-family:sans-serif;padding:20px;background:#f8fafc;"><div style="max-width:580px;margin:0 auto;background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;"><div style="background:#0284c7;padding:20px;text-align:center;color:#fff;"><h2 style="margin:0;">System Update Notice</h2></div><div style="padding:24px;color:#334155;"><span style="background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:4px;font-size:12px;font-weight:bold;">${escapeHtml(item.category)}</span><h3 style="margin:12px 0;">${escapeHtml(item.title)}</h3><div class="ql-editor" style="padding:0;">${item.content}</div></div></div></body></html>`;

            document.getElementById('emailHtmlOutput').value = htmlTemplate;
            const iframe = document.getElementById('emailPreviewIframe');
            const doc = iframe.contentWindow.document;
            doc.open(); doc.write(htmlTemplate); doc.close();
        }

        function copyEmailHTML() {
            const txt = document.getElementById('emailHtmlOutput');
            txt.select(); document.execCommand('copy');
            showToast("Email HTML copied to clipboard!");
        }

        function showToast(msg, isWarning = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').className = isWarning ? "fa-solid fa-circle-exclamation text-amber-400" : "fa-solid fa-circle-check text-emerald-400";
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 3000);
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
</html>
